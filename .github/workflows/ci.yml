name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Test
        run: uv run --no-progress --locked --python 3.13 --extra dev pytest -q -m "not requires_ollama" --cov=src --cov-fail-under=90
